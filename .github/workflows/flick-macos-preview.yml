name: Flick macOS preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Flick.mac.spec'
      - 'Flick.store.spec'
      - 'packaging/flick-app-store.*'
      - 'packaging/build_store_pkg.sh'
      - 'packaging/smoke_macos.py'
      - 'apps/flick/**'
      - 'tests/**'
      - 'requirements-flick.txt'
      - '.gitignore'
      - 'assets/flick-icon-v2.png'
      - '.github/workflows/flick-macos-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-flick.txt pyinstaller
      - name: Test core
        run: |
          python -m unittest discover -s tests
          bash -n packaging/build_store_pkg.sh
      - name: Make macOS icon
        run: |
          mkdir -p build/Flick.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/flick-icon-v2.png --out "build/Flick.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/flick-icon-v2.png --out "build/Flick.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/Flick.iconset -o assets/flick.icns
      - name: Build Apple Silicon app
        run: python -m PyInstaller --noconfirm Flick.mac.spec
      - name: Inspect app bundle
        run: |
          test -x dist/Flick.app/Contents/MacOS/Flick
          plutil -lint dist/Flick.app/Contents/Info.plist
          file dist/Flick.app/Contents/MacOS/Flick
          codesign --verify --deep --strict dist/Flick.app
      - name: Launch EXR in GPU viewer
        run: python packaging/smoke_macos.py
      - name: Package preview
        run: ditto -c -k --keepParent dist/Flick.app dist/Flick-macOS-arm64-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flick-macOS-arm64-preview
          path: dist/Flick-macOS-arm64-preview.zip
          if-no-files-found: error
      - name: Build App Store sandbox preview
        run: python -m PyInstaller --noconfirm Flick.store.spec
      - name: Inspect App Store entitlements
        run: |
          test -f dist/Flick.app/Contents/Resources/flick-app-store.txt
          codesign --force --sign - --entitlements packaging/flick-app-store.entitlements dist/Flick.app
          codesign --verify --deep --strict dist/Flick.app
          codesign --display --entitlements - --xml dist/Flick.app | plutil -convert xml1 -o - - > build/store-entitlements.plist
          python -c "import plistlib; p=plistlib.load(open('build/store-entitlements.plist','rb')); assert p['com.apple.security.app-sandbox']; assert p['com.apple.security.files.user-selected.read-only']"
      - name: Package App Store sandbox preview
        run: ditto -c -k --keepParent dist/Flick.app dist/Flick-macOS-arm64-store-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Flick-macOS-arm64-store-preview
          path: dist/Flick-macOS-arm64-store-preview.zip
          if-no-files-found: error
