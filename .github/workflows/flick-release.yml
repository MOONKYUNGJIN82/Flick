name: Flick Windows release

on:
  push:
    tags:
      - 'flick-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-flick.txt pyinstaller
          choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        env:
          FLICK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: python packaging/build_flick.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Flick.Setup.exe dist/Flick.Setup.exe.sha256 --generate-notes --verify-tag
